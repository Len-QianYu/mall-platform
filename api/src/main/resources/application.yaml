spring:
  application:
    name: api

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false


  config:
    import: "optional:file:.env[.properties],optional:file:api/.env[.properties]"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 数据库连接池 Druid（连接信息沿用上面的配置）：参数对齐原来 HikariCP 的默认值——固定 10 个连接、拿连接最多等 30 秒；
    # Druid 自己默认最多 8 个、拿不到就一直等。启动时就建好连接，MySQL 没开的话后端会直接启动失败
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 10
      max-wait: 30000
      # 监控页 http://127.0.0.1:8080/druid/ ：连接池实时状态、每条 SQL 的执行次数和耗时、每个接口的请求数和查库次数。
      # 只许本机打开（localhost 走 IPv6 的 ::1 也算本机），另有一层登录；Spring Security 对 /druid/** 整段放行。
      # 部署到 Nginx 等反向代理后面时，请求都从本机转发过来，白名单就拦不住了，到时要关掉监控页
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        allow: 127.0.0.1
        login-username: ${DRUID_USERNAME}
        login-password: ${DRUID_PASSWORD}
      # SQL 统计：「SQL 监控」页的数据来源
      filter:
        stat:
          enabled: true
      # Web 统计：「Web 应用」「URI 监控」页的数据来源。静态文件、上传的图片、监控页自己的请求不计入
      # （前半段是 Druid 的默认值，改 exclusions 要整串写全）；接口用 JWT 认证、不建 session，session 统计关掉
      web-stat-filter:
        enabled: true
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*,/avatars/*,/images/*"
        session-stat-enable: false

  # Redis（docker-compose 启动的，本地不设密码）：商品缓存 + Redisson 下单锁。
  # 不可用时商品读接口回退查库；新下单返回可重试的业务错误，已完成请求仍可按请求号查库返回。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 1s
      # 单条命令的超时：默认 60 秒，Redis 卡住时每个请求都要干等；缓存命令正常 1 毫秒内就返回
      timeout: 500ms

  # 缓存实现用 Redis（各缓存的过期时间、序列化方式见 CacheConfiguration）
  cache:
    type: redis

  servlet:
    multipart:
      # 上传的都是图片（头像、商品图），单个 5MB 足够；超出时直接返回 413
      max-file-size: 5MB
      max-request-size: 6MB

# RustFS 对象存储（docker-compose 启动）：桶在首次上传时自动创建，保持私有，由后端提供图片访问。
rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${RUSTFS_ACCESS_KEY}
  secret-key: ${RUSTFS_SECRET_KEY}
  region: ${RUSTFS_REGION:us-east-1}
  bucket: ${RUSTFS_BUCKET:mall-uploads}

# RocketMQ Proxy 的 gRPC 地址（docker-compose 启动的 RocketMQ）
rocketmq:
  endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:8081}

# 收藏商品通知：RocketMQ 消费后持久化，通过 WebSocket 推送给在线用户。
product-notification:
  delivery-enabled: ${PRODUCT_NOTIFICATION_DELIVERY_ENABLED:true}
  dispatch-interval: 2000
  allowed-origins: ${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 下单后多久不支付就自动取消、回补库存（如 15m、30s）；RocketMQ 延时消息最长 3 天
order:
  pay-timeout: ${ORDER_PAY_TIMEOUT:15m}
  create-lock-wait: ${ORDER_CREATE_LOCK_WAIT:3s}

# 支付宝默认关闭，填入本机 .env 后启用；测试和部署可分别配置沙箱/正式网关。
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  seller-id: ${ALIPAY_SELLER_ID:}
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/payment/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/payment/return}

payment:
  mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
  reconcile-enabled: ${PAYMENT_RECONCILE_ENABLED:true}

seckill:
  expiry-enabled: ${SECKILL_EXPIRY_ENABLED:true}

account:
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-secret: ${EMAIL_CODE_SECRET:}
    redis-prefix: ${EMAIL_CODE_REDIS_PREFIX:mall:account-email}

# 支付宝 SDK 的原始错误日志包含带签名的请求 URL；业务日志由 AlipayGateway 记录错误码。
logging:
  level:
    sdk: "OFF"
