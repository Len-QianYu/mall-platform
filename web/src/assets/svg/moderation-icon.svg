<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="商城购物袋">
  <title>商城购物袋</title>

  <defs>
    <linearGradient id="mallBagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="mallTagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <radialGradient id="mallHaloGradient">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.1" />
    </radialGradient>

    <filter id="mallBagShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4338ca" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    .mall-shopping-icon-float {
      animation: mall-shopping-icon-float 6s ease-in-out infinite;
    }

    @keyframes mall-shopping-icon-float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mall-shopping-icon-float {
        animation: none;
      }
    }
  </style>

  <!-- 柔和光晕与落地阴影 -->
  <circle cx="200" cy="202" r="160" fill="url(#mallHaloGradient)" />
  <circle cx="200" cy="202" r="173" fill="none" stroke="#ffffff" stroke-opacity="0.35" />
  <ellipse cx="200" cy="345" rx="105" ry="12" fill="#6366f1" opacity="0.12" />

  <g class="mall-shopping-icon-float">
    <!-- 商城购物袋 -->
    <g filter="url(#mallBagShadow)">
      <path
        d="M122 135 H278 C287 135 294 142 295 151 L309 301 C311 319 297 334 279 334 H121 C103 334 89 319 91 301 L105 151 C106 142 113 135 122 135 Z"
        fill="url(#mallBagGradient)"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-opacity="0.8"
      />
      <path
        d="M122 135 H278 C287 135 294 142 295 151 L299 194 C240 174 170 176 101 204 L105 151 C106 142 113 135 122 135 Z"
        fill="#ffffff"
        opacity="0.14"
      />

      <circle cx="155" cy="157" r="10" fill="#4338ca" opacity="0.25" />
      <circle cx="245" cy="157" r="10" fill="#4338ca" opacity="0.25" />
      <path
        d="M155 157 V124 C155 99 175 79 200 79 C225 79 245 99 245 124 V157"
        fill="none"
        stroke="#ffffff"
        stroke-width="12"
        stroke-linecap="round"
      />

      <!-- 购物车标识 -->
      <g
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M149 210 H163 L177 252 H232 L246 222 H168" />
        <path d="M184 237 H229" stroke-width="3" opacity="0.65" />
      </g>
      <circle cx="183" cy="269" r="6" fill="#ffffff" />
      <circle cx="226" cy="269" r="6" fill="#ffffff" />
    </g>

    <!-- 橙色优惠标签 -->
    <path
      d="M246 148 C263 137 282 145 270 159"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
    />
    <g transform="rotate(15 270 159)" filter="url(#mallBagShadow)">
      <path
        d="M268 129 H308 L337 159 L308 189 H268 A12 12 0 0 1 256 177 V141 A12 12 0 0 1 268 129 Z"
        fill="url(#mallTagGradient)"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
      <circle cx="270" cy="159" r="5" fill="#ffffff" />
      <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
        <path d="M289 172 L308 146" />
        <circle cx="289" cy="149" r="4" />
        <circle cx="310" cy="169" r="4" />
      </g>
    </g>

    <!-- 好物闪光装饰 -->
    <path
      d="M88 93 L92 104 L103 108 L92 112 L88 123 L84 112 L73 108 L84 104 Z"
      fill="#ffffff"
      opacity="0.9"
    />
    <path
      d="M321 67 L325 78 L336 82 L325 86 L321 97 L317 86 L306 82 L317 78 Z"
      fill="#fbbf24"
      opacity="0.9"
    />
    <circle cx="77" cy="231" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="327" cy="286" r="5" fill="#c4b5fd" />
    <circle cx="84" cy="289" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
  </g>
</svg>
